[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-studio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "edge-tts>=7.0",
    "pydantic>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["novastudio"]
